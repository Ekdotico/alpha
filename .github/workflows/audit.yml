name: Audit

# Decay, as opposed to drift. ci.yml gates what a change introduces; this looks for
# what rots without one — a path that was correct until a file moved, a URL that was
# live until DNS changed, a version that was current until a release. No pull request
# causes any of those, so no per-pull-request gate can find them.
#
# The check is `ekdotico-check decay`, which ships in @ekdotico/domico, so the rules
# travel with the version pinned here rather than being restated in this workflow.
#
# Two triggers, because the two failure modes have different clocks:
#
#   schedule       the first of each month. Catches decay that arrives with no commit
#                  at all, which is the class a commit-triggered gate is blind to by
#                  construction.
#   push to main   but only once five commits have accumulated since the last audit.
#                  Running on every push would be noise: the guard reads documents,
#                  and documents do not change on most commits.
#
# The marker is a lightweight `audit-<sha>` tag, and writing it is non-fatal on
# purpose: if the token cannot push a tag the audit still runs, and the only
# consequence is that it runs again sooner than it needed to. A gate that fails
# because its bookkeeping failed teaches people to ignore it.
#
# Permissions are declared per job, read-only everywhere except the job that
# writes the marker. This file used to grant contents: write at the workflow
# level, so the `decide` job, which needs nothing, and the install step, which
# runs every lifecycle script pnpm permits, both held a token that could push to
# main. The push is now a job of its own that checks out, tags, pushes, and
# nothing else. The actions are pinned to commits for the reason ci.yml states.

on:
  schedule:
    - cron: '24 9 1 * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if fewer than five commits have accumulated'
        type: boolean
        default: false

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decide:
    name: Is an audit due?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      due: ${{ steps.count.outputs.due }}
      since: ${{ steps.count.outputs.since }}
    steps:
      # Full history: `git tag` sorting and the commit count are both wrong rather
      # than absent in a shallow clone.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - id: count
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "since=n/a — ${{ github.event_name }}" >> "$GITHUB_OUTPUT"
            echo "Running: ${{ github.event_name }}."
            exit 0
          fi

          last=$(git tag --list 'audit-*' --sort=-creatordate | head -1)
          if [ -z "$last" ]; then
            n=$(git rev-list --count HEAD)
            echo "No audit tag yet; $n commits in history."
          else
            n=$(git rev-list --count "$last"..HEAD)
            echo "$n commit(s) since $last."
          fi

          echo "since=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -ge 5 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Fewer than five commits since the last audit. Nothing to do."
          fi

  audit:
    name: Paths, scripts, guards, URLs, pin
    needs: decide
    if: needs.decide.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # No `version:`, as ci.yml has it — the action reads packageManager from
      # package.json, so the pnpm version is pinned in one place.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # node-version-file and the registry pair, matching ci.yml. registry-url
      # alone would make GitHub Packages the default registry for every
      # dependency, and it does not proxy npmjs.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@ekdotico'

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decay
        run: pnpm exec ekdotico-check decay

  record:
    name: Record the audit
    needs: [decide, audit]
    # Only on a clean audit. A tag written after a failure would suppress the next
    # five commits' worth of checking on the strength of a run that found problems.
    if: success()
    runs-on: ubuntu-latest
    # The one write-capable token in this workflow, held by a job that installs
    # nothing and runs no code from a dependency.
    permissions:
      contents: write
    # Non-fatal, as the header says: bookkeeping that fails must not fail the audit.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - run: |
          set -euo pipefail
          tag="audit-$(git rev-parse --short HEAD)"
          git tag -f "$tag"
          git push origin "$tag" --force
          echo "Recorded $tag (trigger: ${{ github.event_name }}, commits since last: ${{ needs.decide.outputs.since }})."
